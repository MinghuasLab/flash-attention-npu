[build-system]
requires = ["setuptools>=70.1", "packaging", "psutil"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["build", "dist"]

[tool.ruff.lint]
# Keep the policy intentionally small: these rules catch concrete errors
# without imposing a repository-wide lint expansion when Ruff defaults change.
select = ["E4", "E7", "E9", "F"]

# Same input space as test_flash_attn_combine.yaml, executed through the FA4
# interface (flash_attn_npu_4.flash_attn_combine).
name: flash_attn_combine_v4
api: pytorch
api_type: function_flash_attn_combine_v4
version: v2.1
generate: generate_flash_attn_combine
dtype_numbers: 192
extra_numbers: 8
shape_distributions:
  - [0, 1.0]
standard:
  acc:
    cv_fused_double_benchmark:
      max_re_ratio: 2
      avg_re_ratio: 1.2
      root_mean_squared_ratio: 1.2
  perf: not_key
inputs:
  - name: out_partial
    type: tensor
    required: true
    dtypes:
      values: [fp32]
    ranges:
      valid:
        values: [[-0.001, 0.001], [-5, 5]]
        random_types:
          - name: nd
            mean: [-100, 100]
            std: [1, 25]
        custom_dist_ratio: [[0.1, 0.5, 0.0], [0.4, 0.0]]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [5, 4]
      dim_values:
        values: [1, 2, 3, 5, 8, 16, 17, 32, 64, 96, 113, 128, 192, 256]
      max_length: 1048576
    boundary:
      has_empty: true
      has_scalar: true
      has_infnan: false
      has_upper_border: false
      has_lower_border: true
  - name: lse_partial
    type: tensor
    required: true
    dtypes:
      values: [fp32]
    ranges:
      valid:
        values: [[-5, 5]]
        random_types:
          - name: nd
            mean: [-100, 100]
            std: [1, 25]
        custom_dist_ratio: [[0.6, 0.0], [0.4, 0.0]]
      invalid:
        values: ["-inf"]
    boundary:
      has_empty: false
      has_scalar: false
      has_infnan: false
      has_upper_border: false
      has_lower_border: false
    shapes:
      dim_numbers:
        values: [4, 3]
      dim_values:
        values: [1, 2, 3, 5, 8, 16, 17, 32, 64, 96, 113, 128, 192, 256]
      max_length: 1048576
  - name: out_dtype
    type: attr
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [fp16, bf16]

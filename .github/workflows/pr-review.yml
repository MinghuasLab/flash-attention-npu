name: Trusted PR Review

on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review PR snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve PR snapshot and prior audit
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/pr_review.py prepare

      - name: Install Cursor CLI
        if: steps.prepare.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cursor_version='2026.07.20-8cc9c0b'
          cursor_sha256='6e9f17247ffeb5f8f7e2246b4bcd6bb26cb2d5a9f9a4b0012c9a80d868ed25b4'
          cursor_archive="$RUNNER_TEMP/cursor-agent-${cursor_version}.tar.gz"
          cursor_dir="$HOME/.local/share/cursor-agent/versions/${cursor_version}"
          cursor_url="https://downloads.cursor.com/lab/${cursor_version}/linux/x64/agent-cli-package.tar.gz"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$cursor_url" -o "$cursor_archive"
          printf '%s  %s\n' "$cursor_sha256" "$cursor_archive" | sha256sum -c -
          mkdir -p "$cursor_dir" "$HOME/.local/bin"
          tar --no-same-owner --no-same-permissions --strip-components=1 \
            -xzf "$cursor_archive" -C "$cursor_dir"
          test -x "$cursor_dir/cursor-agent"
          test -x "$cursor_dir/node"
          ln -sfn "$cursor_dir/cursor-agent" "$HOME/.local/bin/agent"
          ln -sfn "$cursor_dir/cursor-agent" "$HOME/.local/bin/cursor-agent"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          agent --version

      - name: Run read-only Cursor review
        id: review
        if: steps.prepare.outputs.should_run == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ci/pr_review.py review \
            --pr "${{ steps.prepare.outputs.pr_number }}" \
            --audit-required "${{ steps.prepare.outputs.audit_required }}" \
            --expected-head-sha "${{ steps.prepare.outputs.head_sha }}" \
            --expected-base-sha "${{ steps.prepare.outputs.base_sha }}" \
            --model cursor-grok-4.5-high-fast \
            --output-dir "$RUNNER_TEMP/pr-review-result"

      - name: Publish review for the fixed SHA
        id: publish
        if: steps.prepare.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ci/pr_review.py publish \
            --result "$RUNNER_TEMP/pr-review-result/review_result.json" \
            --pr "${{ steps.prepare.outputs.pr_number }}" \
            --expected-head-sha "${{ steps.prepare.outputs.head_sha }}" \
            --expected-base-sha "${{ steps.prepare.outputs.base_sha }}" \
            --previous-audit "${{ steps.prepare.outputs.previous_audit }}"

      - name: Save review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-review-result/
          if-no-files-found: ignore
          retention-days: 14
